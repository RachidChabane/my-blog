# Editorial slate template — the SHAPE of one autonomous writing run.
#
# cpe v2 (zero loader warnings: version 2 + caps: block + explicit
# on_max_review_rounds; no legacy *_timeout_minutes / top-level max_review_rounds).
# Mirrors docs/writing-flow.md §2/§3 reconciled with cpe-native role mapping:
#   tasks = research -> select -> draft(FR+EN) -> publish
#   review = the draft task's built-in APPROVED/NEEDS_REVISION loop
#   M-4 gate = per-language shell gates on the draft (task 26, via invariants_file + gates_extra)
# publish depends_on [draft], so a blocked draft (gate failure) => publish never
# runs = bilingual-or-nothing (NFR-11, writing-flow.md §6).
#
# pipeline/runner.py:assemble_slate deep-copies this, stamps per-run + config
# knobs (model/effort/caps/backend, optional stage_descriptions), and writes the
# per-run tasks.yaml under pipeline/runs/<run_id>/. Stage logic, prompt bodies,
# the claim->source contract, the M-4 gate, topic memory and the house-style
# guide are seams owned by tasks 24-28; the description fields here are
# substrate placeholders.
version: 2
defaults:
  model: sonnet
  effort: medium
  plans_dir: plans # relative to --dir (run_dir); see README + plan §1
  claude_backend: tmux # M-6 / NFR-10 — subscription pool
  on_max_review_rounds: fail # autonomous-safe: block, never auto-approve
  persona_file: pipeline/house_style.md # FR-G2 (task 25 authors; missing => "")
  invariants_file: pipeline/invariants.yaml # M-4 shell gates (task 26); runner absolutizes
  parallelism: 1 # fan-out is structural (depends_on); >1 needs branch_per_task
  branch_per_task: false
  base_branch: main
  caps:
    max_minutes_per_phase: 30
    max_review_rounds: 2 # OQ-14b
    max_gate_repair_rounds: 1 # OQ-14b — M-4 gate-repair before terminal-block
phases:
  - id: source
    title: 'Research — web-search sweep, capture source excerpts (FR-B1)'
  - id: select
    title: 'Select — angle, semantic dedup vs topic memory, claim skeleton + fallback shortlist (FR-B2)'
  - id: argue
    title: 'Argue -- steelman/attack/reconcile the thesis as a claim (G1 argument-rigor); a weak thesis blocks => fallback to next topic'
  - id: draft
    title: 'Draft — FR+EN parallel outputs + claim->source map; review loop; M-4 gates (FR-B3/B4/C1/C2)'
  - id: publish
    title: 'Publish — commit FR+EN at parallel URLs; trigger build + avatar reindex (FR-B5)'
tasks:
  - id: research
    phase: source
    title: 'Research candidates with captured source excerpts'
    description: |
      [STAGE: Research — writing-flow.md §3 role 1 / §4. Prompt body authored by
      task 24 (pipeline/prompts/research.py); this is a substrate placeholder.]
      Native web-search sweep over cutting-edge AI engineering (D-006). Capture,
      per source, the fetched EXCERPT(s) + URL + retrieval date (not just links —
      the fact-check provenance chain rests on captured text). Write the ranked
      candidate list to plans/task-research/candidates.json.
    key_files: [pipeline/stages/research.py]
    commit_message: 'content(research): candidates.json'
    depends_on: []
  - id: select
    phase: select
    title: 'Select topic+angle, dedup vs topic memory, build brief'
    description: |
      [STAGE: Select — writing-flow.md §3 role 2 / §8. Authored by task 24.]
      Pick one candidate not too semantically similar to prior posts (shared
      multilingual embedder, OQ-5) using topic memory. Write plans/task-select/
      brief.md: chosen topic, angle, outline, the claim skeleton, and the
      fallback shortlist (OQ-14a).
    key_files: [pipeline/stages/select.py]
    commit_message: 'content(select): brief.md'
    depends_on: [research]
  - id: argue
    phase: argue
    title: 'Pressure-test the thesis (steelman -> strongest attack -> reconcile)'
    description: |
      [STAGE: Argue -- G1 argument-rigor (writing-flow.md section 7). Prompt body authored
      by task 3 (pipeline/prompts/argue.py); this is a substrate placeholder.]
      Dispatch ONE fresh judge (judge != author) to steelman the brief's thesis, mount the
      strongest attack, and reconcile; write plans/task-argue/argument.json with a
      defensible|weak verdict plus the strengthened_argument. A 'weak' verdict BLOCKS the
      argument-rigor gate => the run falls back to the next-ranked topic and re-argues it.
      Judges the THESIS AS A CLAIM, not the finished article's craft (that is the editorial
      gate). A blocked argue => draft never runs => publish never runs (bilingual-or-nothing).
    key_files: [pipeline/prompts/argue.py, pipeline/gate/argument.py]
    commit_message: 'content(argue): argument.json (steelman/attack/reconcile)'
    depends_on: [select]
    # G1 gate (task 3): single gate, no fr/en split (the claim skeleton is language-neutral).
    gates_extra: [argument-rigor]
  - id: draft
    phase: draft
    title: 'Draft FR+EN with claim->source map (review loop + M-4 gates apply here)'
    description: |
      [STAGE: Draft+Review+Humanize — writing-flow.md §3 roles 3/4/4b, §5.
      Authored by tasks 25/26.]
      Write draft-fr.md + draft-en.md as PARALLEL outputs of one topic+sources,
      each carrying an explicit claim->source map (plans/task-draft/
      claim_source_map.json, contract from task 24). Review = cpe's built-in
      APPROVED/NEEDS_REVISION loop with an editorial prompt, also enforcing the
      claim->source map is complete. M-4 gates (fact-check / source-grounding /
      style, per language) attach here via gates_extra + invariants_file
      (task 26); a blocking gate => this task blocks => publish never runs
      (bilingual-or-nothing).
    key_files: [pipeline/stages/draft.py]
    commit_message: 'content(draft): FR + EN drafts + claim->source map'
    depends_on: [argue]
    # M-4 gates (task 26): registered from defaults.invariants_file (pipeline/invariants.yaml),
    # scoped to this task. A blocking gate => draft blocks => publish never runs (NFR-11).
    gates_extra:
      [
        factcheck-fr,
        factcheck-en,
        grounding-fr,
        grounding-en,
        style-fr,
        style-en,
      ]
  - id: publish
    phase: publish
    title: 'Publish FR+EN to src/content at parallel URLs; trigger build + reindex'
    description: |
      [STAGE: Publish — writing-flow.md §3 role 6. Authored by task 27.]
      Commit the approved+gated FR & EN posts to src/content at parallel URLs,
      trigger the build, and emit the avatar reindex event (task 21). No manual
      step on this path (D-002).
    key_files: [pipeline/stages/publish.py]
    commit_message: 'content(publish): FR + EN article'
    depends_on: [draft]
