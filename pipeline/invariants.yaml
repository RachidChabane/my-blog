# M-4 EDITORIAL quality gate (FR-C1/C2/C3, NFR-3, writing-flow.md section 4/5).
#
# Six cpe `kind: shell` gates -- fact-check / source-grounding / style, per language --
# attached to the `draft` task via `draft.gates_extra` (pipeline/tasks-template.yaml).
# A blocking gate => draft blocks => publish (depends_on [draft]) never runs =
# bilingual-or-nothing (NFR-11). The harness-owned fallback re-drive
# (pipeline/gate/fallback.py, driven by runner.run) is the safety valve, so M-4 BLOCKs
# here -- distinct from docs/invariants.yaml's warn-for-agent policy on the build slate.
#
# COMMAND CONTRACT (rests on the pinned run-dir contract [MEM: pipeline-cpe-harness-contract]):
# cpe `os.chdir(--dir)`s to the run_dir BEFORE running gates, and the ShellGate passes no
# cwd, so each `command:` runs with cwd = run_dir = repo_root/pipeline/runs/<run_id>.
# Therefore:
#   PYTHONPATH=../../..   -> repo_root (three levels up from run_dir), so `python3 -m
#                            pipeline.gate.<name>` imports the package
#   --run-dir .           -> the run_dir itself (where plans/task-draft/* live)
# Gate names avoid cpe's reserved set {tests, lint, invariant-grep}.

- name: factcheck-fr
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.factcheck --run-dir . --lang fr'
  on_failure: block
  when: [always] # scoped to the draft task via draft.gates_extra
  parallel_safe: true # gates only READ artifacts the draft phase already wrote
  timeout_minutes: 5
  comment: 'M-4 fact-check (FR-C1): provenance integrity + per-claim supported verdict.'

- name: factcheck-en
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.factcheck --run-dir . --lang en'
  on_failure: block
  when: [always]
  parallel_safe: true
  timeout_minutes: 5
  comment: 'M-4 fact-check (FR-C1): provenance integrity + per-claim supported verdict.'

- name: grounding-fr
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.grounding --run-dir . --lang fr'
  on_failure: block
  when: [always]
  parallel_safe: true
  timeout_minutes: 5
  comment: 'M-4 source-grounding (FR-C2): inline citations + reachable sources, no dangling.'

- name: grounding-en
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.grounding --run-dir . --lang en'
  on_failure: block
  when: [always]
  parallel_safe: true
  timeout_minutes: 5
  comment: 'M-4 source-grounding (FR-C2): inline citations + reachable sources, no dangling.'

- name: style-fr
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.style --run-dir . --lang fr'
  on_failure: block
  when: [always]
  parallel_safe: true
  timeout_minutes: 5
  comment: "M-4 style (FR-C3): no-emoji + no-em-dash + FR-diacritics (D-007) + style-auditor 'clean' re-check."

- name: style-en
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.style --run-dir . --lang en'
  on_failure: block
  when: [always]
  parallel_safe: true
  timeout_minutes: 5
  comment: "M-4 style (FR-C3): no-emoji + no-em-dash (D-007) + style-auditor 'clean' re-check."

# G3 EDITORIAL-QUALITY (task 4) -- scoped to the `draft` task via draft.gates_extra.
# SINGLE gate, NO --lang: judged on the EN draft as the canonical realization of the shared
# argument (fr/en structural parity rests on review.py set-equality, not on a second judge).
# The empty tail after `--run-dir .` (no --lang) is what the golden bank's `args: []` extends.
- name: editorial-quality
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.editorial --run-dir .'
  on_failure: block
  when: [always] # scoped to the draft task via draft.gates_extra
  parallel_safe: true # the gate only READS the artifact the draft phase wrote
  timeout_minutes: 5
  comment: 'G3 editorial-quality: a fresh judge rates the finished EN article; BLOCK on a thin verdict.'

# G2 SOURCE-QUALITY (task 5) -- scoped to the `draft` task via draft.gates_extra, ALONGSIDE the
# M-4 factcheck gates (not replacing them). SINGLE gate, NO --lang: the cited source SET is
# identical fr/en (review.py set-equality), so authority/primacy is judged once. The empty tail
# after `--run-dir .` (no --lang) is what the golden bank's `args: []` extends.
- name: source-quality
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.source_quality --run-dir .'
  on_failure: block
  when: [always] # scoped to the draft task via draft.gates_extra
  parallel_safe: true # the gate only READS the artifact the draft phase wrote
  timeout_minutes: 5
  comment: 'G2 source-quality: a fresh judge rates the cited source set; BLOCK on an unsound verdict.'

# G1 ARGUMENT-RIGOR (task 3) -- scoped to the `argue` task via argue.gates_extra, NOT draft.
# Single gate, NO --lang: the brief's claim_skeleton is language-neutral, so the thesis is
# judged once, before the bilingual draft is paid for. The empty tail after `--run-dir .`
# (no --lang) is what the golden bank's `args: []` extends (test_bank_gate_invocations_match_invariants).
- name: argument-rigor
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.argument --run-dir .'
  on_failure: block
  when: [always] # scoped to the argue task via argue.gates_extra
  parallel_safe: true # the gate only READS the artifact the argue phase wrote
  timeout_minutes: 5
  comment: 'G1 argument-rigor: a fresh judge steelmans/attacks/reconciles the thesis; BLOCK on a weak verdict.'

# G4 SOURCE-INDEPENDENCE (task 6) -- scoped to the `argue` task via argue.gates_extra, ALONGSIDE
# argument-rigor (both pre-draft chosen-topic checks). TWO layers: a deterministic distinct-
# registrable-domain backstop on the CHOSEN candidate's cited sources (resolved from the
# authoritative brief.md choice -> candidates.json) + a fresh independence judge catching
# cross-outlet syndication. NO --lang: independence is a property of the chosen topic's source set,
# language-neutral. The empty tail after `--run-dir .` (no --lang) is what the golden bank's
# `args: []` extends (test_bank_gate_invocations_match_invariants).
- name: source-independence
  kind: shell
  command: 'PYTHONPATH=../../.. python3 -m pipeline.gate.independence --run-dir .'
  on_failure: block
  when: [always] # scoped to the argue task via argue.gates_extra
  parallel_safe: true # the gate only READS artifacts (argue/select/research phases wrote them)
  timeout_minutes: 5
  comment: 'G4 source-independence: distinct-domain backstop + a fresh judge; BLOCK on single_origin.'
