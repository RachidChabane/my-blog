name: Avatar reindex

# Periodic + manual avatar-index refresh (Workers AI bge-m3 -> Vectorize + D1).
#
# A content push to main is handled by the CI `deploy` job (ci.yml), which already
# refreshes the index AND deploys the site. To avoid a DOUBLE-DEPLOY this workflow is
# INDEX-ONLY (no site deploy) and is NOT triggered by push — it runs on a nightly
# safety-net schedule + manual dispatch (e.g. to re-seed after a schema change).

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC nightly — index refresh safety net
  workflow_dispatch: {}

concurrency:
  group: avatar-reindex
  cancel-in-progress: false # never interrupt an in-flight index push

jobs:
  reindex:
    name: Refresh avatar index (Vectorize + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secret gate. The live refresh needs the CF token (= EMBEDDINGS_API_KEY, for
      # Workers AI) + CLOUDFLARE_ACCOUNT_ID. Absent during the autonomous build -> a
      # documented no-op (green), not a failure.
      - name: Check secrets present
        id: gate
        env:
          HAS_EMBED: ${{ secrets.EMBEDDINGS_API_KEY != '' }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_EMBED" = "true" ] && [ "$HAS_CF" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Avatar reindex wired but skipped — EMBEDDINGS_API_KEY / CLOUDFLARE_API_TOKEN not set (owner secrets; see DEPLOY.md)."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build + push avatar index (full rebuild -> Vectorize + D1)
        if: steps.gate.outputs.ready == 'true'
        env:
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm build:index --push
