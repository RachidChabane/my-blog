name: Avatar reindex

# Event-driven incremental reindex on publish (content push) + a nightly FULL
# reindex safety net (FR-E3, rag-avatar.md §3). Mode policy lives in tested TS
# (selectMode); this YAML only routes triggers.
#
# COORDINATION (owner, at deploy-wiring time): this job deploys the full dist/ via
# wrangler. D-005 specifies Cloudflare Pages git-push auto-deploy. Pick ONE owner of
# the index deploy to avoid double-deploys — see plans/task-21/plan.md §6 R1.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/articles/**'
      - 'src/content/projects/**'
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC nightly — full reindex safety net
  workflow_dispatch:
    inputs:
      mode:
        description: 'Reindex mode'
        type: choice
        options: [incremental, full]
        default: incremental

concurrency:
  group: avatar-reindex
  cancel-in-progress: false # never interrupt an in-flight index deploy

jobs:
  reindex:
    name: Reindex avatar index + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secret gate. The real embedder (OQ-5) + Cloudflare deploy need owner secrets
      # absent during the autonomous build. Without them this is a documented no-op
      # (green), not a failure — mirrors scripts/build-avatar-index.ts.
      - name: Check secrets present
        id: gate
        env:
          HAS_EMBED: ${{ secrets.EMBEDDINGS_API_KEY != '' }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_EMBED" = "true" ] && [ "$HAS_CF" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Avatar reindex wired but skipped — EMBEDDINGS_API_KEY / CLOUDFLARE_API_TOKEN not set (post-secret step; OQ-5)."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Reindex (mode derived from the trigger)
        id: reindex
        if: steps.gate.outputs.ready == 'true'
        env:
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rachidchabane.dev' }}
        run: |
          DISPATCH_MODE="${{ github.event.inputs.mode }}"
          pnpm reindex --event="${{ github.event_name }}" ${DISPATCH_MODE:+--mode="$DISPATCH_MODE"}

      - name: Build site (copies the refreshed public/avatar-index.json into dist/)
        if: steps.gate.outputs.ready == 'true'
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@3 pages deploy dist --project-name=my-blog --branch=main
