name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (astro check + eslint + prettier)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

  # Lighthouse runs in CI for the "Lighthouse >= 90" criterion (task 29 / NFR-1) but
  # is NON-BLOCKING: `continue-on-error: true` at the job level + no `needs:` ⇒ it
  # runs in PARALLEL and a sub-0.90 / flaky score reports without failing the run
  # (the project's WARN tier — never wedges an autonomous gate). The blocking
  # `e2e` gate covers perf via deterministic proxies (e2e/perf.spec.ts); do NOT
  # un-skip the in-spec Lighthouse test by setting LIGHTHOUSE=1 here (it lives in
  # the blocking gate). `pnpm dlx lighthouse` pulls no browser of its own → uses the
  # preinstalled Chrome via CHROME_PATH; no `playwright install` needed.
  lighthouse:
    name: Lighthouse (non-blocking, perf >= 0.90)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + start preview
        run: |
          pnpm build
          pnpm preview --port 4321 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/en/ >/dev/null && break; sleep 1; done

      - name: Lighthouse (budget + score gate)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          pnpm lh
          node -e "const s=require('./perf/.lh-report.json').categories.performance.score; if(s<0.9){console.error('Lighthouse perf '+s+' < 0.90'); process.exit(1)} else console.log('Lighthouse perf '+s)"

  # M-8 deploy: on push to main, refresh the avatar index (Workers AI bge-m3 ->
  # Vectorize + D1) then build + deploy the static site to Cloudflare Pages. This is
  # the SINGLE index+deploy owner on a content push; reindex.yml is index-only
  # (schedule/dispatch) so there is no double-deploy. Gated on owner secrets: absent
  # during the autonomous build -> a documented no-op (green), never a failure.
  deploy:
    name: Deploy (avatar index + Pages)
    runs-on: ubuntu-latest
    needs: [lint-and-test, e2e]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Check secrets present
        id: gate
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_EMBED: ${{ secrets.EMBEDDINGS_API_KEY != '' }}
        run: |
          if [ "$HAS_CF" = "true" ] && [ "$HAS_EMBED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy wired but skipped — CLOUDFLARE_API_TOKEN / EMBEDDINGS_API_KEY not set (owner secrets; see DEPLOY.md)."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Full rebuild + replace into Vectorize + D1 (bge-m3, ~$0 at this corpus size).
      # Runs every deploy; could be content-path-gated later for efficiency.
      - name: Build + push avatar index
        if: steps.gate.outputs.ready == 'true'
        env:
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm build:index --push

      - name: Build static site
        if: steps.gate.outputs.ready == 'true'
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy dist --project-name=my-blog --branch=main
