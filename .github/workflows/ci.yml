name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (astro check + eslint + prettier)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

  # Lighthouse runs in CI for the "Lighthouse >= 90" criterion (task 29 / NFR-1) but
  # is NON-BLOCKING: `continue-on-error: true` at the job level + no `needs:` ⇒ it
  # runs in PARALLEL and a sub-0.90 / flaky score reports without failing the run
  # (the project's WARN tier — never wedges an autonomous gate). The blocking
  # `e2e` gate covers perf via deterministic proxies (e2e/perf.spec.ts); do NOT
  # un-skip the in-spec Lighthouse test by setting LIGHTHOUSE=1 here (it lives in
  # the blocking gate). `pnpm dlx lighthouse` pulls no browser of its own → uses the
  # preinstalled Chrome via CHROME_PATH; no `playwright install` needed.
  lighthouse:
    name: Lighthouse (non-blocking, perf >= 0.90)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + start preview
        run: |
          pnpm build
          pnpm preview --port 4321 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/en/ >/dev/null && break; sleep 1; done

      - name: Lighthouse (budget + score gate)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          pnpm lh
          node -e "const s=require('./perf/.lh-report.json').categories.performance.score; if(s<0.9){console.error('Lighthouse perf '+s+' < 0.90'); process.exit(1)} else console.log('Lighthouse perf '+s)"

  # Pipeline ratchet (CI-1 / docs/pipeline-audit-2026-06-11.md): run the Python
  # content-engine's pytest + ruff so the rigor cannot silently regress — a commit
  # that un-wires a gate (drops a gates_extra entry, makes invariants_file relative,
  # breaks a gate's exit-1 contract) goes RED here instead of shipping to a live daily
  # run. Independent job (NOT in deploy.needs): a pipeline regression must be visible,
  # but it is orthogonal to the static-site build, so it does not block a site deploy.
  # cpe is a PRIVATE cross-repo dependency (not a pip package), so it is checked out at
  # a PINNED sha (see pipeline/cpe-pin.txt) using the owner secret CPE_REPO_TOKEN. The
  # job is secret-GATED (like deploy): absent token -> documented green skip, never red.
  pipeline:
    name: Pipeline (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check cpe token present
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CPE_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pipeline pytest/ruff skipped — CPE_REPO_TOKEN not set (private cpe repo; see docs/pipeline-audit-2026-06-11.md CI-1)."
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.ready == 'true'

      - name: Checkout cpe (pinned)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          repository: RachidChabane/claude-plan-execute
          ref: 576f5e765a7d808c4f24bc473ec0882995ee8cfa # keep in sync with pipeline/cpe-pin.txt
          path: claude-plan-execute
          token: ${{ secrets.CPE_REPO_TOKEN }}

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.13'

      - name: Install (cpe editable + ruff/pytest)
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pip install -U pip
          pip install -e ./claude-plan-execute
          pip install ruff pytest

      - name: ruff + pytest (gate wiring + golden bank)
        if: steps.gate.outputs.ready == 'true'
        env:
          CLAUDE_PLAN_EXECUTE_HOME: ${{ github.workspace }}/claude-plan-execute
        run: |
          ruff check pipeline
          python -m pytest pipeline -q

  # M-8 deploy: on push to main, refresh the avatar index (Workers AI bge-m3 ->
  # Vectorize + D1) then build + deploy the static site to Cloudflare Pages. This is
  # the SINGLE index+deploy owner on a content push; reindex.yml is index-only
  # (schedule/dispatch) so there is no double-deploy. Gated on owner secrets: absent
  # during the autonomous build -> a documented no-op (green), never a failure.
  deploy:
    name: Deploy (avatar index + Pages)
    runs-on: ubuntu-latest
    needs: [lint-and-test, e2e]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Check secrets present
        id: gate
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_EMBED: ${{ secrets.EMBEDDINGS_API_KEY != '' }}
        run: |
          if [ "$HAS_CF" = "true" ] && [ "$HAS_EMBED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy wired but skipped — CLOUDFLARE_API_TOKEN / EMBEDDINGS_API_KEY not set (owner secrets; see DEPLOY.md)."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Full rebuild + replace into Vectorize + D1 (bge-m3, ~$0 at this corpus size).
      # Runs every deploy; could be content-path-gated later for efficiency.
      - name: Build + push avatar index
        if: steps.gate.outputs.ready == 'true'
        env:
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm build:index --push

      - name: Build static site
        if: steps.gate.outputs.ready == 'true'
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy dist --project-name=my-blog --branch=main
